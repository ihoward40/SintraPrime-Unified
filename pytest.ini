[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = --tb=short -q --import-mode=importlib -m "not experimental"
testpaths =
    tests
    portal/tests
    voice_concierge/governed/tests
    voice_runtime/tests
norecursedirs =
    apps
    deployment
    web
    mobile
    models
    shared
    docs
    .github
    node_modules
    operator
    artifacts
    phase19/revenue_smoke_test
markers =
    experimental: tests that exercise experimental or unfinished integrations and are not part of the default CI lane
    integration: tests that require external services or infrastructure
    postgresql: tests that require a disposable PostgreSQL database
    slow: tests that take longer than a normal unit test
    smoke: fast end-to-end smoke tests validating critical paths without external services