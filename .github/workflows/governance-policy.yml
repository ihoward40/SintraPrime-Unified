name: Governance Policy

on:
  pull_request:
    paths:
      - "governance/**"
      - "tests/governance/**"
      - ".github/workflows/governance-policy.yml"
  push:
    branches:
      - main
    paths:
      - "governance/**"
      - "tests/governance/**"
      - ".github/workflows/governance-policy.yml"

permissions:
  contents: read

jobs:
  governance-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run governance policy tests
        run: python -m pytest -q tests/governance/test_executive_parliament_policy.py
