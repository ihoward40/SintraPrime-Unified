name: Ruff Gate2 Format Once

on:
  push:
    branches:
      - feat/ike-bot-governed-top-features-20260819

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ike-bot-governed-top-features-20260819
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.15.20
      - name: Apply mechanical Ruff fixes
        run: |
          ruff check --fix \
            portal/scripts/postgresql_bootstrap.py \
            portal/services/durable_orchestration_authority.py \
            portal/services/mission_control_execution_service.py \
            portal/services/production_orchestration_persistence.py \
            portal/tests/test_durable_mission_control_postgresql.py
      - name: Commit mechanical fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            portal/scripts/postgresql_bootstrap.py \
            portal/services/durable_orchestration_authority.py \
            portal/services/mission_control_execution_service.py \
            portal/services/production_orchestration_persistence.py \
            portal/tests/test_durable_mission_control_postgresql.py
          git commit -m "chore(gate2): apply mechanical Ruff fixes"
          git push origin HEAD:feat/ike-bot-governed-top-features-20260819
