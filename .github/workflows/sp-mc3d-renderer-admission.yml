name: SP-MC3D Renderer Admission

on:
  push:
    branches:
      - feat/sp-mc3d-001-town
    paths:
      - web/package.json
      - web/src/pages/mission-control/MissionControlTown.tsx
      - web/src/pages/mission-control/three/**
      - web/tests/e2e/mission-control-town-3d.spec.ts
      - .github/workflows/sp-mc3d-renderer-admission.yml

permissions:
  contents: write

concurrency:
  group: sp-mc3d-renderer-admission
  cancel-in-progress: false

jobs:
  lockfile-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sp-mc3d-001-town
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Regenerate synchronized lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile only when changed
        working-directory: .
        run: |
          if git diff --quiet -- web/package-lock.json; then
            echo "LOCKFILE_UNCHANGED=true"
          else
            git config user.name "sintraprime-certification-bot"
            git config user.email "actions@users.noreply.github.com"
            git add web/package-lock.json
            git commit -m "chore(mc3d): synchronize renderer dependency lockfile"
            git push origin HEAD:feat/sp-mc3d-001-town
          fi

      - name: Install exact dependency graph
        run: npm ci

      - name: TypeScript and production build
        run: npm run build

      - name: Install Chromium for renderer smoke
        run: npx playwright install --with-deps chromium

      - name: Browser smoke — enter governed 3D town
        run: npx playwright test tests/e2e/mission-control-town-3d.spec.ts --project=chromium
