name: SintraPrime typecheck and runtime contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sintraprime/**'
      - '.github/workflows/sintraprime-typecheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20.0.0', '24']
    defaults:
      run:
        working-directory: apps/sintraprime
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/sintraprime/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Test restored runtime contracts without external writes
        run: node --require tsx/cjs --test tests/unit/confidence-engine.test.mjs tests/integration/notion-adapters.test.mjs tests/integration/monitor-cli.test.mjs
      - run: git diff --exit-code -- package.json package-lock.json
