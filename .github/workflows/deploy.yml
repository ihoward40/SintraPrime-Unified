name: Deploy SintraPrime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docker-compose.yml"
      - "core/**"
      - "apps/**"
      - "deployment/**"
      - "infrastructure/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker images with CI-safe fallbacks
        env:
          RAW_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RAW_MINIO_PASSWORD: ${{ secrets.MINIO_PASSWORD }}
          RAW_MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          RAW_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          RAW_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          RAW_TWIN_AUTH_TOKEN: ${{ secrets.TWIN_AUTH_TOKEN }}
        run: |
          JWT_SECRET="${RAW_JWT_SECRET:-ci-build-placeholder-jwt-secret}" \
          MINIO_PASSWORD="${RAW_MINIO_PASSWORD:-ci-build-placeholder-minio-password}" \
          MINIO_ROOT_USER="${RAW_MINIO_ROOT_USER:-ci-build-placeholder-minio-user}" \
          POSTGRES_PASSWORD="${RAW_POSTGRES_PASSWORD:-ci-build-placeholder-postgres-password}" \
          SECRET_KEY="${RAW_SECRET_KEY:-ci-build-placeholder-secret-key}" \
          TWIN_AUTH_TOKEN="${RAW_TWIN_AUTH_TOKEN:-ci-build-placeholder-twin-token}" \
          docker compose build
