name: Ruff Residual Report Once

on:
  push:
    branches:
      - feat/ike-bot-governed-top-features-20260819

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/ike-bot-governed-top-features-20260819

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Ruff
        run: pip install ruff==0.15.20

      - name: Capture residual lint
        shell: bash
        run: |
          mkdir -p artifacts/ci
          ruff check . --output-format=concise > artifacts/ci/ruff-residual.txt 2>&1 || true
          printf '\n--- COUNT ---\n' >> artifacts/ci/ruff-residual.txt
          ruff check . --statistics >> artifacts/ci/ruff-residual.txt 2>&1 || true

      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ci/ruff-residual.txt
          git commit -m "chore(ci): capture Ruff residual diagnostics"
          git push origin HEAD:feat/ike-bot-governed-top-features-20260819
