name: Ruff Autofix Once

on:
  push:
    branches:
      - feat/ike-bot-governed-top-features-20260819

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/ike-bot-governed-top-features-20260819

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Ruff
        run: pip install ruff==0.15.20

      - name: Apply safe Ruff fixes
        run: ruff check . --fix

      - name: Commit safe fixes if any
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No safe Ruff autofixes were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply pinned Ruff safe autofixes"
          git push origin HEAD:feat/ike-bot-governed-top-features-20260819
