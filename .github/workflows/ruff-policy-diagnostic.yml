name: Ruff Policy Diagnostic

on:
  push:
    branches:
      - feat/economic-governance-provenance

permissions:
  contents: read

jobs:
  ruff-policy-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact Ruff
        run: pip install ruff==0.15.20
      - name: Print canonical import fix
        run: ruff check --select I --fix --diff packages/economic_governance/policy.py
