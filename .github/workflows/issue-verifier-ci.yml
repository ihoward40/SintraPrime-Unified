name: IssueVerifier CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit email-validator

      - name: Run unit tests (scoped)
        run: python -m pytest --tb=short -q

      # P0-002: bandit now uses .bandit-baseline.json to suppress pre-existing
      # findings. Only NEW issues (regressions) will fail the build.
      - name: Security lint (bandit — baseline mode)
        run: bandit -r . -x tests/,portal/tests/ -ll --baseline .bandit-baseline.json -f json -o /tmp/bandit.json || true && python scripts/check_bandit.py

      - name: Dependency vulnerability scan (safety)
        # Safety is installed in an ISOLATED virtual environment to prevent
        # its packaging<22 dependency from contaminating the application
        # test environment. Safety 2.3.5 supports anonymous scanning using
        # the non-commercial vulnerability database.
        # Safety 3.x requires platform authentication and crashes in
        # unauthenticated CI with TypeError: 'Timeout' object cannot be
        # interpreted as an integer during JWKS fetch.
        run: |
          python -m venv .venv-safety
          .venv-safety/bin/pip install safety==2.3.5
          .venv-safety/bin/safety check -r requirements.txt