# Alembic configuration for SintraPrime Portal database migrations.
# This file is committed to the repository and used by all environments.
#
# Deployment contract (Option B — R3-K):
#   Migrations ship as a separate provisioning artefact (this directory).
#   The installed application wheel does NOT bundle migration files.
#   Provisioning is performed by a deployment step that checks out the
#   repository (or a dedicated migrations package) and runs:
#       alembic -c alembic.ini upgrade head
#   The installed app then connects to the already-migrated database.

[alembic]
# Path to migration scripts, relative to this file.
script_location = portal/alembic

# Template file for new revision scripts.
file_template = %%(rev)s_%%(slug)s

# Timezone for revision timestamps (informational only).
timezone = UTC

# Truncate revision ID prefix in filenames.
truncate_slug_length = 40

# Revision numbering.
revision_environment = false

# Output encoding for generated migration scripts.
output_encoding = utf-8

# SQLAlchemy URL — overridden at runtime via SQLALCHEMY_URL env var
# or by setting sqlalchemy.url in alembic/env.py.
# In CI and production, supply DATABASE_URL or SQLALCHEMY_URL instead.
sqlalchemy.url = %(SQLALCHEMY_URL)s


[post_write_hooks]
# No post-write hooks configured.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %%H:%%M:%%S
