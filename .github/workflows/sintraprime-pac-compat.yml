name: SintraPrime PAC compatibility

on:
  push:
    branches: ['fix/**']
    paths:
      - 'apps/sintraprime/**'
      - '.github/workflows/sintraprime-pac-compat.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/sintraprime/**'
      - '.github/workflows/sintraprime-pac-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pac-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20.0.0', '20.18.0', '22', '24']
    defaults:
      run:
        working-directory: apps/sintraprime
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/sintraprime/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test pac-compat.test.cjs
      - run: git diff --exit-code -- package.json package-lock.json
