name: Ruff Gate4C Import Diff Once

on:
  pull_request:
    paths:
      - "portal/services/restricted_external_action.py"
      - ".github/workflows/ruff-gate4c-import-diff-once.yml"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.20
      - name: Show canonical import diff
        run: ruff check portal/services/restricted_external_action.py --select I001 --fix --diff || true
