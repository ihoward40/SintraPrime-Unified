name: SintraPrime app tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sintraprime/**'
      - '.github/workflows/sintraprime-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20.0.0', '24']
    defaults:
      run:
        working-directory: apps/sintraprime
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/sintraprime/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:integration
      - run: git diff --exit-code -- package.json package-lock.json
