name: SintraPrime CI
on:
  push:
    branches: [ main, dev, feature/* ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full test suite
        run: python -m pytest --tb=short -q
      - name: Run repo truth smoke check
        run: python scripts/smoke/repo_truth_check.py
      - name: Report test inventory (dynamic count)
        run: python scripts/ci/report_test_inventory.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
      - name: Upload test inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-inventory
          path: artifacts/ci/test-inventory.json
          if-no-files-found: ignore
  # GOV-001A: fail-closed governance regression gate.
  # governance/tests is absent from pytest.ini testpaths, so the default
  # `python -m pytest` invocation never collects it. Targets are named
  # explicitly so the fail-closed contract is exercised by controlling CI
  # rather than merely existing in the repository. Deliberately narrow:
  # broad governance/tests discovery is out of scope for GOV-001A.
  gov-001a-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: GOV-001A fail-closed regression suite
        run: python -m pytest governance/tests/test_gov001a_fail_closed.py -v --tb=short
      - name: Directly modified existing governance behavior
        run: |
          python -m pytest \
            "governance/tests/test_governance.py::TestRiskAssessor::test_assess_unknown_action_fails_closed" \
            "governance/tests/test_governance.py::TestGovernanceEngine::test_requires_approval_decorator_allows_low" \
            -v --tb=short
  # GOV-001B Wave 1 (minimal): bounded security-critical regression gates.
  #
  # These two jobs make governance/security/agent_protocol/trust_law test
  # suites execute in CI via explicit file targets only -- no conftest.py
  # change, no SINTRAPRIME_TEST_LANES env var, no directory-level discovery
  # change. Each suite's collection is measured by the existing
  # scripts/ci/report_test_inventory.py and gated by
  # scripts/ci/assert_test_floor.py BEFORE pytest actually executes the
  # suite, so an incomplete or below-floor collection fails the job even if
  # pytest itself would otherwise report green on zero collected tests.
  # gov-001a-regression above remains the sole REQUIRED status check and is
  # untouched by this change. Floors bind per suite, not as a combined total,
  # so one suite's growth cannot mask another suite's regression.
  governance-security-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gov001a
            suite: governance/tests/test_gov001a_fail_closed.py
            floor: 37
          - name: governance
            suite: governance/tests/test_governance.py
            floor: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve subject binding
        id: subject
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse "HEAD^{tree}")" >> "$GITHUB_OUTPUT"
      - name: Measure collection (${{ matrix.name }})
        run: |
          python scripts/ci/report_test_inventory.py \
            --pytest-args "${{ matrix.suite }}" \
            --out "artifacts/ci/${{ matrix.name }}-inventory.json" \
            --commit "${{ steps.subject.outputs.commit }}" \
            --tree "${{ steps.subject.outputs.tree }}"
      - name: Assert collection floor (${{ matrix.name }})
        run: |
          python scripts/ci/assert_test_floor.py \
            --receipt "artifacts/ci/${{ matrix.name }}-inventory.json" \
            --expect-commit "${{ steps.subject.outputs.commit }}" \
            --expect-tree "${{ steps.subject.outputs.tree }}" \
            --floor ${{ matrix.floor }} \
            --name "${{ matrix.name }}"
      - name: Execute suite (${{ matrix.name }})
        run: python -m pytest ${{ matrix.suite }} -v --tb=short
      - name: Upload inventory receipt (${{ matrix.name }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gov001b-${{ matrix.name }}-inventory
          path: artifacts/ci/${{ matrix.name }}-inventory.json
          if-no-files-found: ignore
  security-critical-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: security
            suite: security/tests/test_security.py
            floor: 58
          - name: agent_protocol
            suite: agent_protocol/tests/test_agent_protocol.py
            floor: 64
          - name: trust_law
            suite: trust_law/tests/test_trust_law.py
            floor: 73
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve subject binding
        id: subject
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse "HEAD^{tree}")" >> "$GITHUB_OUTPUT"
      - name: Measure collection (${{ matrix.name }})
        run: |
          python scripts/ci/report_test_inventory.py \
            --pytest-args "${{ matrix.suite }}" \
            --out "artifacts/ci/${{ matrix.name }}-inventory.json" \
            --commit "${{ steps.subject.outputs.commit }}" \
            --tree "${{ steps.subject.outputs.tree }}"
      - name: Assert collection floor (${{ matrix.name }})
        run: |
          python scripts/ci/assert_test_floor.py \
            --receipt "artifacts/ci/${{ matrix.name }}-inventory.json" \
            --expect-commit "${{ steps.subject.outputs.commit }}" \
            --expect-tree "${{ steps.subject.outputs.tree }}" \
            --floor ${{ matrix.floor }} \
            --name "${{ matrix.name }}"
      - name: Execute suite (${{ matrix.name }})
        run: python -m pytest ${{ matrix.suite }} -v --tb=short
      - name: Upload inventory receipt (${{ matrix.name }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gov001b-${{ matrix.name }}-inventory
          path: artifacts/ci/${{ matrix.name }}-inventory.json
          if-no-files-found: ignore
  postgresql-race:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sintraprime
          POSTGRES_PASSWORD: sintraprime
          POSTGRES_DB: sintraprime_unified
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sintraprime -d sintraprime_unified"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Wait for PostgreSQL readiness
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: sintraprime_unified
          PGUSER: sintraprime
          PGPASSWORD: sintraprime
        run: |
          python - <<'PY'
          import asyncio
          import os

          import asyncpg

          async def main() -> None:
              for attempt in range(60):
                  try:
                      conn = await asyncpg.connect(
                          user=os.environ["PGUSER"],
                          password=os.environ["PGPASSWORD"],
                          host=os.environ["PGHOST"],
                          port=int(os.environ["PGPORT"]),
                          database=os.environ["PGDATABASE"],
                      )
                      await conn.execute("SELECT 1")
                      await conn.close()
                      return
                  except Exception:
                      if attempt == 59:
                          raise
                      await asyncio.sleep(1)

          asyncio.run(main())
          PY
      - name: Prepare PostgreSQL schema
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: sintraprime_unified
          PGUSER: sintraprime
          PGPASSWORD: sintraprime
        run: |
          python - <<'PY'
          import asyncio
          import os

          from portal import models as _models  # noqa: F401
          from portal.database import Base
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main() -> None:
              database_url = (
                  "postgresql+asyncpg://"
                  + os.environ["PGUSER"]
                  + ":"
                  + os.environ["PGPASSWORD"]
                  + "@"
                  + os.environ["PGHOST"]
                  + ":"
                  + os.environ["PGPORT"]
                  + "/"
                  + os.environ["PGDATABASE"]
              )
              engine = create_async_engine(database_url, echo=False)
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
              await engine.dispose()

          asyncio.run(main())
          PY
      - name: Run PostgreSQL concurrency test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: sintraprime_unified
          PGUSER: sintraprime
          PGPASSWORD: sintraprime
          MISSION_CONTROL_PG_RACE_REQUIRED: '1'
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          env = os.environ.copy()
          env["DATABASE_URL"] = (
              "postgresql+asyncpg://"
              + env["PGUSER"]
              + ":"
              + env["PGPASSWORD"]
              + "@"
              + env["PGHOST"]
              + ":"
              + env["PGPORT"]
              + "/"
              + env["PGDATABASE"]
          )
          cmd = [
              sys.executable,
              "-m",
              "pytest",
              "-vv",
              "-rs",
              "-s",
              "--tb=long",
              "--maxfail=1",
              "portal/tests/test_mission_control_run_controls.py::test_parallel_pg_transition_race_appends_exactly_one_event",
              "portal/tests/test_mission_control_run_controls.py::test_pg_flushed_transition_rollback_does_not_persist",
          ]
          with open("/tmp/pg_race.log", "w", encoding="utf-8") as log:
              result = subprocess.run(cmd, env=env, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(result.stdout, end="")
              log.write(result.stdout)
          if result.returncode != 0:
              raise SystemExit(result.returncode)
          if "2 passed" not in result.stdout or "SKIPPED" in result.stdout:
              raise SystemExit("PostgreSQL race result did not prove 2 executed passes")
          PY
      - name: Upload PostgreSQL race log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-race-log
          path: /tmp/pg_race.log
          if-no-files-found: ignore
  postgresql-bootstrap-certification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sintraprime_bootstrap
          POSTGRES_PASSWORD: sintraprime_bootstrap
          POSTGRES_DB: sintraprime_bootstrap_certification
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sintraprime_bootstrap -d sintraprime_bootstrap_certification"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run raw-SQL PostgreSQL bootstrap certification
        env:
          PGPASSWORD: sintraprime_bootstrap
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: sintraprime_bootstrap_certification
          PGUSER: sintraprime_bootstrap
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/postgresql-bootstrap-certification.log
          import os
          import pytest

          scheme = "postgresql" + "://"
          os.environ["POSTGRESQL_BOOTSTRAP_TEST_DATABASE_URL"] = (
              scheme
              + os.environ["PGUSER"]
              + "@"
              + os.environ["PGHOST"]
              + ":"
              + os.environ["PGPORT"]
              + "/"
              + os.environ["PGDATABASE"]
          )
          raise SystemExit(pytest.main([
              "-vv",
              "-rs",
              "--tb=long",
              "--maxfail=1",
              "portal/tests/test_postgresql_bootstrap_schema_authority.py",
          ]))
          PY
          ! grep -q 'SKIPPED' /tmp/postgresql-bootstrap-certification.log
      - name: Upload PostgreSQL bootstrap certification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-bootstrap-certification-log
          path: /tmp/postgresql-bootstrap-certification.log
          if-no-files-found: ignore
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install ruff==0.15.20
      - run: ruff check . --output-format=github
  claims-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate documentation and claims integrity
        run: python scripts/ci/validate_repository_claims.py
      - name: Run validator tests
        run: python -m pytest scripts/ci/tests/ -q
  auth-tenant-rbac-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run auth/tenant/RBAC certification suite
        run: set -o pipefail && python -m pytest portal/tests/test_auth_tenant_rbac_certification.py -q | tee /tmp/auth-tenant-rbac-certification.log
      - name: Upload certification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-tenant-rbac-certification-log
          path: /tmp/auth-tenant-rbac-certification.log
          if-no-files-found: ignore
  audit-correlation-non-http-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run audit correlation and non-HTTP certification suite
        run: set -o pipefail && python -m pytest portal/tests/test_audit_correlation_non_http_certification.py -q | tee /tmp/audit-correlation-non-http-certification.log
      - name: Upload certification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-correlation-non-http-certification-log
          path: /tmp/audit-correlation-non-http-certification.log
          if-no-files-found: ignore
  http-correlation-ws-hardening-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run HTTP correlation and WebSocket hardening certification suite
        run: set -o pipefail && python -m pytest portal/tests/test_http_correlation_ws_hardening_certification.py -q | tee /tmp/http-correlation-ws-hardening-certification.log
      - name: Upload certification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-correlation-ws-hardening-certification-log
          path: /tmp/http-correlation-ws-hardening-certification.log
          if-no-files-found: ignore
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install bandit
        run: pip install bandit
      - name: Dependency vulnerability scan (safety)
        # Safety is installed in an ISOLATED virtual environment outside the
        # repository source tree to prevent its dependencies (packaging<22,
        # vendored libraries) from contaminating the application test
        # environment and from being scanned by Bandit.
        run: |
          python -m venv "${RUNNER_TEMP}/sintraprime-safety-venv"
          "${RUNNER_TEMP}/sintraprime-safety-venv/bin/pip" install safety==2.3.5
          "${RUNNER_TEMP}/sintraprime-safety-venv/bin/safety" check -r requirements.txt
      - name: Security lint (bandit — baseline mode)
        run: bandit -r . -x tests/,portal/tests/ -ll --baseline .bandit-baseline.json -f json -o /tmp/bandit.json || true && python scripts/check_bandit.py
